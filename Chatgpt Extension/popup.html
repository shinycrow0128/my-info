<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Send prompt to ChatGPT</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <span class="top-title">ChatGPT Auto Prompt</span>
      <button
        id="popout"
        type="button"
        class="link"
        title="Reopen this panel as a window pinned to the right of the screen"
      >
        Pop out
      </button>
    </header>

    <!-- One row per bid that is still waiting on its ChatGPT package. Several
         run at once, so this is a list rather than a single slot. -->
    <section id="jobs" class="jobs" hidden></section>

    <p id="track-error" class="track-error" hidden></p>
    <div id="track-retry" class="track-retry" hidden>
      <button id="retry-meta" type="button" class="link">Retry</button>
    </div>

    <!-- One form, one button: these fields file the application, and the same
         click sends the job description to ChatGPT. The resume and the cover
         letter are not asked for - they are what comes back. -->
    <div class="grid-2">
      <div>
        <label class="label" for="profile-name">Profile *</label>
        <select id="profile-name"></select>
      </div>
      <div>
        <label class="label" for="track-status">Status</label>
        <select id="track-status"></select>
      </div>
    </div>
    <p class="hint">The profile picks the resume template that is sent with the job description.</p>

    <label class="label" for="job-title">Job title *</label>
    <input id="job-title" type="text" placeholder="Senior React Developer" />

    <div class="grid-2">
      <div>
        <label class="label" for="company">Company</label>
        <input id="company" type="text" placeholder="Acme Inc." />
      </div>
      <div>
        <label class="label" for="applied-at">Applied on</label>
        <input id="applied-at" type="date" />
      </div>
    </div>

    <label class="label" for="job-link">Job link</label>
    <input id="job-link" type="url" placeholder="https://…" />

    <label class="label" for="prompt">Job description *</label>
    <textarea
      id="prompt"
      placeholder="Paste the job description here…"
      autofocus
    ></textarea>

    <label class="label" for="notes">Notes</label>
    <textarea id="notes" class="short" rows="2"></textarea>

    <div class="row">
      <button id="send" type="button">Send to ChatGPT</button>
    </div>

    <p id="status" class="status" role="status"></p>

    <script src="assets.js"></script>
    <script src="tracker.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
